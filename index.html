<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Hospital Appointment Management System</h1>
    </header>

    <main>
        <h2>Hospital Management Dashboard</h2>

        <section id="patient-section">
            <h3>Patient Registration</h3>
        </section>

        <section id="doctor-section">
            <h3>Doctor Management</h3>
        </section>

        <section id="appointment-section">
            <h3>Appointment Scheduling</h3>
        </section>

        <section id="history-section">
            <h3>Appointment History</h3>
        </section>

	<section id="patient-section">
    		<h3>Patient Registration</h3>

    		<form id="patientForm">
        		<input type="text" id="patientName" placeholder="Patient Name" required>
        		<input type="number" id="patientAge" placeholder="Age" required>
        		<input type="text" id="patientPhone" placeholder="Phone Number" required>
        		<button type="submit">Register Patient</button>
   		</form>

    		<p id="patientMessage"></p>
	</section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
